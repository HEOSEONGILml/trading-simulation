# 운영 서버용: Caddy(HTTPS) + 앱 + 매일 DB 백업
# 실행: DOMAIN=example.com docker compose -f docker-compose.prod.yml up -d --build
services:
  app:
    build: .
    image: blindcandle-app
    restart: unless-stopped
    volumes:
      - app-data:/data

  # 매일 21시(KST) 차트 퀴즈를 스레드와 X에 게시 (server/src/quiz/run.ts)
  quiz:
    # app과 같은 이미지를 쓴다 (따로 빌드하지 않음)
    image: blindcandle-app
    pull_policy: never
    depends_on:
      - app
    restart: unless-stopped
    command: ["node", "server/src/quiz/run.ts"]
    env_file:
      - path: secrets.env
        required: false
    volumes:
      - app-data:/data
    healthcheck:
      disable: true

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN 환경 변수가 필요합니다}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

  # 하루에 한 번 SQLite 온라인 백업, 14일치 보관
  backup:
    image: alpine:3
    restart: unless-stopped
    volumes:
      - app-data:/data:ro
      - ./backups:/backups
    command: >
      sh -c "apk add --no-cache sqlite >/dev/null &&
      while true; do
        sqlite3 /data/results.db \".backup /backups/results-$$(date +%F).db\" &&
        find /backups -name 'results-*.db' -mtime +14 -delete;
        sleep 86400;
      done"

volumes:
  app-data:
  caddy-data:
  caddy-config:
